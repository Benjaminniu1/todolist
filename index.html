<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>博远跟单看板 · 完全开放</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 1300px;
            width: 100%;
            background: #ffffff;
            padding: 28px 24px 32px;
            border-radius: 28px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25);
        }
        h1 {
            text-align: center;
            font-weight: 600;
            font-size: 1.9rem;
            margin: 0 0 12px 0;
            color: #0a1e2f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .status-badge {
            font-size: 0.8rem;
            background: #d1e0f0;
            padding: 4px 14px;
            border-radius: 40px;
            color: #1d3b5a;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            background: #f9fcff;
            padding: 16px 18px;
            border-radius: 48px;
            border: 1px solid #e2eaf2;
        }
        .row input, .row button {
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid #d4dfe9;
            font-size: 0.95rem;
            background: white;
            flex: 1 1 140px;
        }
        .row button {
            background: #3b82f6;
            color: white;
            border: none;
            font-weight: 500;
            cursor: pointer;
            flex: 0 1 auto;
            padding: 10px 28px;
            box-shadow: 0 4px 8px -4px rgba(59, 130, 246, 0.3);
        }
        .row button:hover { background: #2563eb; transform: scale(0.97); }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 6px;
        }
        .col {
            background: #f6faff;
            padding: 14px 12px 20px;
            border-radius: 24px;
            min-height: 340px;
            border: 1px solid #e8eff6;
        }
        .col h3 {
            margin: 0 0 14px 6px;
            font-weight: 600;
            font-size: 1.25rem;
            color: #1b3a5c;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .col h3::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, #d0ddee, transparent);
            margin-left: 8px;
        }
        .task {
            background: white;
            border: 1px solid #e2edf8;
            padding: 14px 14px 12px;
            margin-bottom: 12px;
            border-radius: 18px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .task img {
            width: 52px;
            height: 52px;
            object-fit: cover;
            border-radius: 14px;
            cursor: pointer;
            border: 1px solid #dae6f2;
            background: #f2f8ff;
        }
        .task b {
            font-weight: 600;
            font-size: 1rem;
            color: #0d2847;
        }
        .timer {
            font-family: monospace;
            font-size: 0.9rem;
            padding: 4px 12px;
            border-radius: 40px;
            display: inline-block;
            align-self: flex-start;
            font-weight: 500;
        }
        .red { background: #ffe4e6; color: #b91c1c; }
        .yellow { background: #fef9c3; color: #854d0e; }
        .blue { background: #dbeafe; color: #1d4ed8; }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .actions button {
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 30px;
            border: 1px solid #d4e0ed;
            background: #fafdff;
            cursor: pointer;
        }
        .actions button:hover { background: #e9f0fa; }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-box {
            width: 360px;
            background: white;
            padding: 28px 26px 24px;
            border-radius: 32px;
            box-shadow: 0 40px 60px -20px rgba(0,0,0,0.4);
        }
        .modal-box input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 40px;
            border: 1px solid #d2ddee;
            margin-bottom: 14px;
        }
        .modal-btns {
            display: flex;
            gap: 12px;
            margin-top: 6px;
        }
        .modal-btns button {
            flex: 1;
            padding: 11px 0;
            border-radius: 40px;
            border: none;
            font-weight: 500;
            cursor: pointer;
        }
        .modal-btns button:first-child { background: #3b82f6; color: white; }
        .modal-btns button:last-child { background: #f1f5f9; color: #1e293b; }
        #file { display: none; }
        @media (max-width: 760px) { .board { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1>
        📋 博远外贸订单跟进看板
        <span id="statusBadge" class="status-badge">⏳ 连接中...</span>
    </h1>

    <div class="row">
        <input id="name" placeholder="任务名称" />
        <input id="time" type="datetime-local" />
        <button onclick="addTask()">➕ 新增</button>
        <input type="file" id="file" accept="image/*" hidden />
    </div>

    <div class="board">
        <div class="col" id="todo"><h3>📌 待办</h3></div>
        <div class="col" id="doing"><h3>⚡ 进行中</h3></div>
        <div class="col" id="done"><h3>✅ 已完成</h3></div>
    </div>
</div>

<!-- 编辑弹窗 -->
<div id="modal" class="modal">
    <div class="modal-box">
        <h3>✏️ 编辑任务</h3>
        <input id="editName" placeholder="任务名称" />
        <input id="editTime" type="datetime-local" />
        <div class="modal-btns">
            <button onclick="saveEdit()">保存</button>
            <button onclick="closeModal()">取消</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  配置
    // ============================================================
    const SUPABASE_URL = 'https://iconjenlrbaqowhyfysq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imljb25qZW5scmJhcW93aHlmeXNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0Mjc5MDMsImV4cCI6MjA5ODAwMzkwM30.dB6GxRS704yNn8YPRd5jt-rTpW-Vs1u86R1Ca2RD0EU';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM 引用
    const todoCol = document.getElementById('todo');
    const doingCol = document.getElementById('doing');
    const doneCol = document.getElementById('done');
    const nameInput = document.getElementById('name');
    const timeInput = document.getElementById('time');
    const fileInput = document.getElementById('file');
    const modal = document.getElementById('modal');
    const editName = document.getElementById('editName');
    const editTime = document.getElementById('editTime');
    const statusBadge = document.getElementById('statusBadge');

    let editId = null;
    let currentImgId = null;
    let cachedTasks = []; // 用于定时器更新倒计时

    // ============================================================
    //  工具函数
    // ============================================================
    function formatTimeLeft(ms) {
        if (ms <= 0) return '⏳ 已结束';
        const s = Math.floor(ms / 1000);
        const d = Math.floor(s / 86400);
        const h = Math.floor((s % 86400) / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = Math.floor(s % 60);
        let parts = [];
        if (d) parts.push(d + '天');
        if (h) parts.push(h + '小时');
        if (m) parts.push(m + '分');
        parts.push(sec + '秒');
        return parts.join(' ');
    }

    function getTimerColor(ms) {
        const days = ms / 86400000;
        if (days < 1) return 'red';
        if (days <= 2) return 'yellow';
        return 'blue';
    }

    // ============================================================
    //  渲染
    // ============================================================
    function renderTasks(tasks) {
        todoCol.innerHTML = '<h3>📌 待办</h3>';
        doingCol.innerHTML = '<h3>⚡ 进行中</h3>';
        doneCol.innerHTML = '<h3>✅ 已完成</h3>';

        if (!tasks || tasks.length === 0) return;

        const now = Date.now();
        tasks.forEach(task => {
            const diff = task.time - now;
            const div = document.createElement('div');
            div.className = 'task';
            div.dataset.id = task.id;

            let imgHtml = '';
            if (task.image_url) {
                imgHtml = `<img src="${task.image_url}" alt="图片" onclick="uploadImg(${task.id})" title="点击更换" />`;
            } else {
                imgHtml = `<div style="font-size:0.75rem; color:#7d9ab5;">📷 无图片</div>`;
            }

            div.innerHTML = `
                ${imgHtml}
                <div><b>${task.name}</b></div>
                <div><span class="timer ${getTimerColor(diff)}">${formatTimeLeft(diff)}</span></div>
                <div class="actions">
                    <button onclick="uploadImg(${task.id})">🖼️ 图片</button>
                    <button onclick="openEdit(${task.id})">✏️ 修改</button>
                    <button onclick="deleteTask(${task.id})">🗑️ 删除</button>
                </div>
            `;

            const targetCol = task.status === 'todo' ? todoCol :
                              task.status === 'doing' ? doingCol : doneCol;
            targetCol.appendChild(div);
        });
    }

    // ============================================================
    //  数据操作（不含 user_id 过滤，因为 RLS 已禁用）
    // ============================================================
    async function loadTasks() {
        try {
            statusBadge.textContent = '⏳ 加载中...';
            const { data, error } = await supabase
                .from('tasks')
                .select('*')
                .order('time', { ascending: true });
            if (error) throw error;
            cachedTasks = data || [];
            renderTasks(cachedTasks);
            statusBadge.textContent = '✅ 已同步';
            statusBadge.style.background = '#dcfce7';
        } catch (err) {
            console.error('加载失败:', err);
            statusBadge.textContent = '❌ 连接失败';
            statusBadge.style.background = '#fee2e2';
            alert('无法连接 Supabase，请检查网络或配置。');
        }
    }

    window.addTask = async function() {
        const name = nameInput.value.trim();
        const timeVal = timeInput.value;
        if (!name) return alert('请输入任务名称');
        if (!timeVal) return alert('请选择截止时间');

        const timestamp = new Date(timeVal).getTime();
        if (isNaN(timestamp)) return alert('时间格式无效');

        const newTask = {
            id: Date.now() + Math.floor(Math.random() * 1000),
            name: name,
            time: timestamp,
            status: 'todo',
            image_url: null,
        };

        try {
            const { error } = await supabase.from('tasks').insert([newTask]);
            if (error) throw error;
            nameInput.value = '';
            timeInput.value = '';
            await loadTasks();
        } catch (err) {
            alert('新增失败: ' + err.message);
        }
    };

    window.deleteTask = async function(id) {
        if (!confirm('确定删除该任务吗？')) return;

        try {
            // 先查询图片 URL
            const { data, error: fetchErr } = await supabase
                .from('tasks')
                .select('image_url')
                .eq('id', id)
                .single();
            if (fetchErr) throw fetchErr;

            if (data.image_url) {
                const fileName = `${id}.jpg`;
                await supabase.storage.from('task-images').remove([fileName]);
            }

            const { error } = await supabase.from('tasks').delete().eq('id', id);
            if (error) throw error;
            await loadTasks();
        } catch (err) {
            alert('删除失败: ' + err.message);
        }
    };

    window.openEdit = function(id) {
        supabase.from('tasks').select('*').eq('id', id).single()
            .then(({ data, error }) => {
                if (error) throw error;
                editId = id;
                editName.value = data.name;
                const dt = new Date(data.time);
                const local = new Date(dt.getTime() - dt.getTimezoneOffset() * 60000);
                editTime.value = local.toISOString().slice(0, 16);
                modal.style.display = 'flex';
            })
            .catch(err => alert('获取任务失败: ' + err.message));
    };

    window.saveEdit = async function() {
        if (editId === null) return;
        const newName = editName.value.trim();
        const newTime = editTime.value;
        if (!newName) return alert('名称不能为空');
        if (!newTime) return alert('请选择时间');
        const ts = new Date(newTime).getTime();
        if (isNaN(ts)) return alert('时间无效');

        try {
            const { error } = await supabase
                .from('tasks')
                .update({ name: newName, time: ts })
                .eq('id', editId);
            if (error) throw error;
            closeModal();
            await loadTasks();
        } catch (err) {
            alert('更新失败: ' + err.message);
        }
    };

    window.closeModal = function() {
        modal.style.display = 'none';
        editId = null;
    };

    // ============================================================
    //  图片上传
    // ============================================================
    window.uploadImg = function(id) {
        currentImgId = id;
        fileInput.click();
    };

    fileInput.addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
            alert('请选择图片文件');
            fileInput.value = '';
            return;
        }

        try {
            const compressedBlob = await compressImage(file, 800, 0.7);
            const fileName = `${currentImgId}.jpg`;

            // 上传到存储桶
            const { error } = await supabase.storage
                .from('task-images')
                .upload(fileName, compressedBlob, {
                    cacheControl: '3600',
                    upsert: true,
                });
            if (error) throw error;

            // 获取公开 URL
            const { data: urlData } = supabase.storage
                .from('task-images')
                .getPublicUrl(fileName);
            const publicUrl = urlData.publicUrl;

            // 更新数据库
            const { error: updateErr } = await supabase
                .from('tasks')
                .update({ image_url: publicUrl })
                .eq('id', currentImgId);
            if (updateErr) throw updateErr;

            fileInput.value = '';
            await loadTasks();
        } catch (err) {
            alert('图片上传失败: ' + err.message);
            fileInput.value = '';
        }
    });

    function compressImage(file, maxSize, quality) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > h) {
                        if (w > maxSize) { h *= maxSize / w; w = maxSize; }
                    } else {
                        if (h > maxSize) { w *= maxSize / h; h = maxSize; }
                    }
                    canvas.width = Math.round(w);
                    canvas.height = Math.round(h);
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob((blob) => {
                        if (blob) resolve(blob);
                        else reject(new Error('压缩失败'));
                    }, 'image/jpeg', quality);
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    // ============================================================
    //  实时订阅
    // ============================================================
    function subscribeRealtime() {
        const channel = supabase
            .channel('tasks-channel')
            .on(
                'postgres_changes',
                {
                    event: '*',
                    schema: 'public',
                    table: 'tasks',
                },
                (payload) => {
                    console.log('实时更新:', payload);
                    loadTasks();
                }
            )
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    console.log('✅ 实时订阅已开启');
                } else {
                    console.warn('订阅状态:', status);
                }
            });
    }

    // ============================================================
    //  定时更新倒计时（每秒）
    // ============================================================
    setInterval(() => {
        if (cachedTasks.length === 0) return;
        const now = Date.now();
        document.querySelectorAll('.task').forEach(el => {
            const id = parseInt(el.dataset.id);
            const task = cachedTasks.find(t => t.id === id);
            if (!task) return;
            const diff = task.time - now;
            const timerSpan = el.querySelector('.timer');
            if (timerSpan) {
                timerSpan.textContent = formatTimeLeft(diff);
                timerSpan.className = `timer ${getTimerColor(diff)}`;
            }
        });
    }, 1000);

    // ============================================================
    //  初始化
    // ============================================================
    async function init() {
        await loadTasks();
        subscribeRealtime();

        // 默认时间（当前+2小时）
        const defaultTime = new Date(Date.now() + 7200000);
        const localDefault = new Date(defaultTime.getTime() - defaultTime.getTimezoneOffset() * 60000);
        timeInput.value = localDefault.toISOString().slice(0, 16);

        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });
    }

    init().catch(console.error);

    // 暴露全局
    window.loadTasks = loadTasks;
    window.addTask = addTask;
    window.deleteTask = deleteTask;
    window.openEdit = openEdit;
    window.saveEdit = saveEdit;
    window.closeModal = closeModal;
    window.uploadImg = uploadImg;
</script>
</body>
</html>
