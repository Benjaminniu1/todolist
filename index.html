<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>博远跟单看板 · 完成计时</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #eef2f7; margin: 0; padding: 24px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 1800px; width: 100%; background: #ffffff; padding: 28px 24px 32px; border-radius: 28px; box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25); }
        h1 { text-align: center; font-weight: 600; font-size: 1.9rem; margin: 0 0 6px 0; color: #0a1e2f; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .status-badge { font-size: 0.8rem; background: #d1e0f0; padding: 4px 14px; border-radius: 40px; color: #1d3b5a; }
        .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 28px; padding: 8px 12px 12px; font-size: 0.9rem; background: #f8fcff; border-radius: 40px; margin: 6px auto 16px; border: 1px solid #e2eaf2; max-width: 900px; }
        .stats span { display: flex; align-items: center; gap: 4px; }
        .stats .count { font-weight: 700; color: #1d4ed8; background: #dbeafe; padding: 0 10px; border-radius: 20px; font-size: 0.85rem; }
        .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 20px; background: #f9fcff; padding: 16px 18px; border-radius: 48px; border: 1px solid #e2eaf2; }
        .row input, .row button { padding: 10px 16px; border-radius: 40px; border: 1px solid #d4dfe9; font-size: 0.95rem; background: white; flex: 1 1 140px; }
        .row button { background: #3b82f6; color: white; border: none; font-weight: 500; cursor: pointer; flex: 0 1 auto; padding: 10px 28px; box-shadow: 0 4px 8px -4px rgba(59, 130, 246, 0.3); }
        .row button:hover { background: #2563eb; transform: scale(0.97); }
        .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-top: 6px; }
        .col { background: #f6faff; padding: 14px 10px 20px; border-radius: 24px; min-height: 300px; border: 1px solid #e8eff6; }
        .col h3 { margin: 0 0 12px 4px; font-weight: 600; font-size: 1.1rem; color: #1b3a5c; display: flex; align-items: center; gap: 6px; }
        .col h3::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, #d0ddee, transparent); margin-left: 6px; }
        .task { background: white; border: 1px solid #e2edf8; padding: 12px 12px 10px; margin-bottom: 10px; border-radius: 18px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 4px; cursor: grab; transition: 0.1s; }
        .task:active { cursor: grabbing; }
        .task img { width: 48px; height: 48px; object-fit: cover; border-radius: 12px; cursor: pointer; border: 1px solid #dae6f2; background: #f2f8ff; }
        .task img:hover { opacity: 0.8; }
        .task b { font-weight: 600; font-size: 0.95rem; color: #0d2847; }
        .timer { font-family: monospace; font-size: 0.8rem; padding: 2px 10px; border-radius: 30px; display: inline-block; align-self: flex-start; font-weight: 500; }
        .red { background: #ffe4e6; color: #b91c1c; }
        .yellow { background: #fef9c3; color: #854d0e; }
        .blue { background: #dbeafe; color: #1d4ed8; }
        .gray { background: #e5e7eb; color: #374151; }
        .green { background: #dcfce7; color: #166534; } /* 保留备用 */
        .actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .actions button { font-size: 0.7rem; padding: 4px 10px; border-radius: 30px; border: 1px solid #d4e0ed; background: #fafdff; cursor: pointer; }
        .actions button:hover { background: #e9f0fa; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 999; }
        .modal-box { width: 360px; background: white; padding: 28px 26px 24px; border-radius: 32px; box-shadow: 0 40px 60px -20px rgba(0,0,0,0.4); }
        .modal-box input { width: 100%; padding: 12px 14px; border-radius: 40px; border: 1px solid #d2ddee; margin-bottom: 14px; }
        .modal-btns { display: flex; gap: 12px; margin-top: 6px; }
        .modal-btns button { flex: 1; padding: 11px 0; border-radius: 40px; border: none; font-weight: 500; cursor: pointer; }
        .modal-btns button:first-child { background: #3b82f6; color: white; }
        .modal-btns button:last-child { background: #f1f5f9; color: #1e293b; }
        #file { display: none; }
        .image-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none;
            justify-content: center; align-items: center; z-index: 1000; cursor: pointer;
        }
        .image-modal img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .image-modal .close-btn { position: absolute; top: 20px; right: 30px; font-size: 40px; color: white; font-weight: bold; cursor: pointer; }
        .sortable-ghost { opacity: 0.4; background: #dbeafe; }
        .sortable-drag { opacity: 0.8; transform: scale(1.02); box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        @media (max-width: 1200px) { .board { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .board { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) { .board { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1>
        📋 博远外贸订单跟进看板
        <span id="statusBadge" class="status-badge">⏳ 连接中...</span>
    </h1>
    <div class="stats" id="statsBar">
        <span>📌 待办 <span class="count" id="stat-todo">0</span></span>
        <span>⚡ 进行中 <span class="count" id="stat-doing">0</span></span>
        <span>❗ 已逾期 <span class="count" id="stat-done">0</span></span>
        <span>📦 已打包待发货 <span class="count" id="stat-shipping">0</span></span>
        <span>📦 已发货 <span class="count" id="stat-archived">0</span></span>
    </div>
    <div class="row">
        <input id="name" placeholder="任务名称" />
        <input id="time" type="datetime-local" />
        <button onclick="addTask()">➕ 新增</button>
        <input type="file" id="file" accept="image/*" hidden />
    </div>
    <div class="board">
        <div class="col" id="todo"><h3>📌 待办</h3></div>
        <div class="col" id="doing"><h3>⚡ 进行中</h3></div>
        <div class="col" id="done"><h3>❗ 已逾期</h3></div>
        <div class="col" id="shipping"><h3>📦 已打包待发货</h3></div>
        <div class="col" id="archived"><h3>📦 已发货</h3></div>
    </div>
</div>

<!-- 编辑弹窗 -->
<div id="modal" class="modal">
    <div class="modal-box">
        <h3>✏️ 编辑任务</h3>
        <input id="editName" placeholder="任务名称" />
        <input id="editTime" type="datetime-local" />
        <div class="modal-btns">
            <button onclick="saveEdit()">保存</button>
            <button onclick="closeModal()">取消</button>
        </div>
    </div>
</div>

<!-- 大图预览 -->
<div id="imageModal" class="image-modal" onclick="closeImageModal()">
    <span class="close-btn">&times;</span>
    <img id="previewImage" src="" alt="大图预览" />
</div>

<script>
// ============================================================
// 1. 配置
// ============================================================
const SUPABASE_URL = 'https://iconjenlrbaqowhyfysq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imljb25qZW5scmJhcW93aHlmeXNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0Mjc5MDMsImV4cCI6MjA5ODAwMzkwM30.dB6GxRS704yNn8YPRd5jt-rTpW-Vs1u86R1Ca2RD0EU';

const API_URL = SUPABASE_URL + '/rest/v1';
const HEADERS = {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
};

// ============================================================
// 2. DOM 引用
// ============================================================
const dom = {
    todo: document.getElementById('todo'),
    doing: document.getElementById('doing'),
    done: document.getElementById('done'),
    shipping: document.getElementById('shipping'),
    archived: document.getElementById('archived'),
    name: document.getElementById('name'),
    time: document.getElementById('time'),
    file: document.getElementById('file'),
    modal: document.getElementById('modal'),
    editName: document.getElementById('editName'),
    editTime: document.getElementById('editTime'),
    status: document.getElementById('statusBadge'),
    imageModal: document.getElementById('imageModal'),
    previewImage: document.getElementById('previewImage'),
    stats: {
        todo: document.getElementById('stat-todo'),
        doing: document.getElementById('stat-doing'),
        done: document.getElementById('stat-done'),
        shipping: document.getElementById('stat-shipping'),
        archived: document.getElementById('stat-archived'),
    }
};

// ============================================================
// 3. 状态
// ============================================================
const state = {
    editId: null,
    currentImgId: null,
    cachedTasks: [],
    isFirstLoad: true,
    notifiedTasks: new Set(),
    sortableInstances: [],
};

// ============================================================
// 4. 工具函数
// ============================================================
function formatTimeLeft(ms) {
    if (ms <= 0) return '⏳ 已结束';
    const s = Math.floor(ms / 1000);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = Math.floor(s % 60);
    let parts = [];
    if (d) parts.push(d + '天');
    if (h) parts.push(h + '小时');
    if (m) parts.push(m + '分');
    parts.push(sec + '秒');
    return parts.join(' ');
}

// 格式化已完成时间（精确到秒）
function formatCompletedTime(completedAt) {
    if (!completedAt) return '❗ 已逾期';
    const now = Date.now();
    const diff = now - completedAt;
    if (diff < 0) return '❗ 已逾期';
    const s = Math.floor(diff / 1000);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    let parts = [];
    if (d) parts.push(d + '天');
    if (h) parts.push(h + '小时');
    if (m) parts.push(m + '分');
    parts.push(sec + '秒');
    return '❗ 已逾期 ' + parts.join('');
}

function getTimerColor(ms) {
    const days = ms / 86400000;
    if (days < 1) return 'red';
    if (days <= 2) return 'yellow';
    return 'blue';
}

// ============================================================
// 5. 大图模态框
// ============================================================
function openImageModal(url) {
    dom.previewImage.src = url;
    dom.imageModal.style.display = 'flex';
}
function closeImageModal() {
    dom.imageModal.style.display = 'none';
}

// ============================================================
// 6. 数据库操作（fetch）
// ============================================================
async function fetchSupabase(endpoint, options = {}) {
    const res = await fetch(API_URL + endpoint, {
        ...options,
        headers: { ...HEADERS, ...(options.headers || {}) }
    });
    if (!res.ok) {
        const text = await res.text();
        throw new Error(`HTTP ${res.status}: ${text}`);
    }
    return res;
}

// 更新任务状态，同时处理 completed_at
async function updateTaskStatus(id, newStatus) {
    const updateData = { status: newStatus };
    if (newStatus === 'done') {
        updateData.completed_at = Date.now();
    } else {
        updateData.completed_at = null;
    }
    await fetchSupabase('/tasks?id=eq.' + id, {
        method: 'PATCH',
        body: JSON.stringify(updateData)
    });
}

// ============================================================
// 7. 渲染 + 统计更新
// ============================================================
function renderTasks(tasks) {
    dom.todo.innerHTML = '<h3>📌 待办</h3>';
    dom.doing.innerHTML = '<h3>⚡ 进行中</h3>';
    dom.done.innerHTML = '<h3>❗ 已逾期</h3>';
    dom.shipping.innerHTML = '<h3>📦 已打包待发货</h3>';
    dom.archived.innerHTML = '<h3>📦 已发货</h3>';

    const counts = { todo: 0, doing: 0, done: 0, shipping: 0, archived: 0 };
    if (tasks && tasks.length) {
        tasks.forEach(t => { if (counts.hasOwnProperty(t.status)) counts[t.status]++; });
    }
    dom.stats.todo.textContent = counts.todo;
    dom.stats.doing.textContent = counts.doing;
    dom.stats.done.textContent = counts.done;
    dom.stats.shipping.textContent = counts.shipping;
    dom.stats.archived.textContent = counts.archived;

    if (!tasks || tasks.length === 0) {
        initSortable();
        return;
    }

    const now = Date.now();
    tasks.forEach(task => {
        const diff = task.time - now;
        const div = document.createElement('div');
        div.className = 'task';
        div.dataset.id = task.id;

        let imgHtml = '';
        if (task.image_url) {
            imgHtml = `<img src="${task.image_url}" alt="图片" onclick="openImageModal('${task.image_url}')" title="点击查看大图" />`;
        } else {
            imgHtml = `<div style="font-size:0.7rem; color:#7d9ab5;">📷 无图片</div>`;
        }

        let timerText, timerClass;
        if (task.status === 'archived') {
            timerText = '📦 已发货';
            timerClass = 'gray';
        } else if (task.status === 'done') {
            // 已完成：红色背景 + 精确计时
            timerText = formatCompletedTime(task.completed_at);
            timerClass = 'red';
        } else {
            // 其他状态：倒计时
            timerText = formatTimeLeft(diff);
            timerClass = getTimerColor(diff);
        }

        div.innerHTML = `
            ${imgHtml}
            <div><b>${task.name}</b></div>
            <div><span class="timer ${timerClass}">${timerText}</span></div>
            <div class="actions">
                <button onclick="uploadImg(${task.id})">🖼️ 图片</button>
                <button onclick="openEdit(${task.id})">✏️ 修改</button>
                <button onclick="deleteTask(${task.id})">🗑️ 删除</button>
            </div>
        `;

        let targetCol;
        if (task.status === 'todo') targetCol = dom.todo;
        else if (task.status === 'doing') targetCol = dom.doing;
        else if (task.status === 'done') targetCol = dom.done;
        else if (task.status === 'shipping') targetCol = dom.shipping;
        else if (task.status === 'archived') targetCol = dom.archived;
        else targetCol = dom.todo;
        targetCol.appendChild(div);
    });
    initSortable();
}

// ============================================================
// 8. 加载任务
// ============================================================
async function loadTasks(silent = false) {
    try {
        if (!silent || state.isFirstLoad) {
            dom.status.textContent = '⏳ 加载中...';
        }
        const res = await fetchSupabase('/tasks?select=*&order=time.asc');
        const data = await res.json();
        state.cachedTasks = data || [];
        renderTasks(state.cachedTasks);
        if (!silent || state.isFirstLoad) {
            dom.status.textContent = '✅ 已同步';
            dom.status.style.background = '#dcfce7';
            state.isFirstLoad = false;
        }
        checkAndNotify();
    } catch (err) {
        console.error('加载失败:', err);
        dom.status.textContent = '❌ 连接失败';
        dom.status.style.background = '#fee2e2';
        if (!silent) alert('无法连接 Supabase，请检查网络或配置。');
    }
}

// ============================================================
// 9. 新增/删除/编辑
// ============================================================
function addTask() {
    const name = dom.name.value.trim();
    const timeVal = dom.time.value;
    if (!name) return alert('请输入任务名称');
    if (!timeVal) return alert('请选择截止时间');
    const timestamp = new Date(timeVal).getTime();
    if (isNaN(timestamp)) return alert('时间格式无效');
    const newTask = {
        id: Date.now() + Math.floor(Math.random() * 1000),
        name,
        time: timestamp,
        status: 'todo',
        image_url: null,
        completed_at: null,
    };
    fetchSupabase('/tasks', {
        method: 'POST',
        body: JSON.stringify([newTask])
    })
    .then(() => {
        dom.name.value = '';
        dom.time.value = '';
        loadTasks(false);
    })
    .catch(err => alert('新增失败: ' + err.message));
}

function deleteTask(id) {
    if (!confirm('确定删除该任务吗？')) return;
    fetchSupabase('/tasks?select=image_url&id=eq.' + id)
        .then(res => res.json())
        .then(data => {
            const task = Array.isArray(data) ? data[0] : data;
            if (task && task.image_url) {
                const fileName = `${id}.jpg`;
                fetch(SUPABASE_URL + '/storage/v1/object/task-images/' + fileName, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
                }).catch(err => console.warn('删除图片失败:', err));
            }
            return fetchSupabase('/tasks?id=eq.' + id, { method: 'DELETE' });
        })
        .then(() => loadTasks(false))
        .catch(err => {
            console.error('删除失败:', err);
            alert('删除失败: ' + err.message);
        });
}

function openEdit(id) {
    fetchSupabase('/tasks?select=*&id=eq.' + id)
        .then(res => res.json())
        .then(([data]) => {
            if (!data) throw new Error('任务不存在');
            state.editId = id;
            dom.editName.value = data.name;
            const dt = new Date(data.time);
            const local = new Date(dt.getTime() - dt.getTimezoneOffset() * 60000);
            dom.editTime.value = local.toISOString().slice(0, 16);
            dom.modal.style.display = 'flex';
        })
        .catch(err => alert('获取任务失败: ' + err.message));
}
function saveEdit() {
    if (state.editId === null) return;
    const newName = dom.editName.value.trim();
    const newTime = dom.editTime.value;
    if (!newName) return alert('名称不能为空');
    if (!newTime) return alert('请选择时间');
    const ts = new Date(newTime).getTime();
    if (isNaN(ts)) return alert('时间无效');
    fetchSupabase('/tasks?id=eq.' + state.editId, {
        method: 'PATCH',
        body: JSON.stringify({ name: newName, time: ts })
    })
    .then(() => {
        closeModal();
        loadTasks(false);
    })
    .catch(err => alert('更新失败: ' + err.message));
}
function closeModal() {
    dom.modal.style.display = 'none';
    state.editId = null;
}

// ============================================================
// 10. 图片上传（带版本号）
// ============================================================
function uploadImg(id) {
    state.currentImgId = id;
    dom.file.click();
}
dom.file.addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
        alert('请选择图片文件');
        dom.file.value = '';
        return;
    }
    try {
        const compressedBlob = await compressImage(file, 800, 0.7);
        const fileName = `${state.currentImgId}.jpg`;

        const uploadRes = await fetch(SUPABASE_URL + '/storage/v1/object/task-images/' + fileName, {
            method: 'PUT',
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'image/jpeg',
                'x-upsert': 'true'
            },
            body: compressedBlob
        });
        if (!uploadRes.ok) {
            const errText = await uploadRes.text();
            throw new Error('上传图片失败: ' + errText);
        }

        const publicUrl = SUPABASE_URL + '/storage/v1/object/public/task-images/' + fileName + '?v=' + Date.now();
        await fetchSupabase('/tasks?id=eq.' + state.currentImgId, {
            method: 'PATCH',
            body: JSON.stringify({ image_url: publicUrl })
        });

        dom.file.value = '';
        await loadTasks(false);
    } catch (err) {
        alert('图片上传失败: ' + err.message);
        dom.file.value = '';
    }
});

function compressImage(file, maxSize, quality) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                if (w > h) {
                    if (w > maxSize) { h *= maxSize / w; w = maxSize; }
                } else {
                    if (h > maxSize) { w *= maxSize / h; h = maxSize; }
                }
                canvas.width = Math.round(w);
                canvas.height = Math.round(h);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                canvas.toBlob((blob) => {
                    if (blob) resolve(blob);
                    else reject(new Error('压缩失败'));
                }, 'image/jpeg', quality);
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

// ============================================================
// 11. 桌面通知 & 自动移动 & 倒计时检查
// ============================================================
function requestNotificationPermission() {
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }
}
function checkAndNotify() {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    const now = Date.now();
    state.cachedTasks.forEach(task => {
        if (task.status === 'archived' || task.status === 'shipping' || task.status === 'done') return;
        const diff = task.time - now;
        if (diff > 0 && diff < 21600000) {
            if (!state.notifiedTasks.has(task.id)) {
                state.notifiedTasks.add(task.id);
                new Notification('⏰ 任务即将到期', {
                    body: `任务 "${task.name}" 剩余时间不足6小时！`,
                    icon: task.image_url || undefined
                });
            }
        }
        if (diff <= 0 || task.status === 'done') {
            state.notifiedTasks.delete(task.id);
        }
    });
}
async function autoMoveExpiredTasks() {
    const now = Date.now();
    let hasChanges = false;
    for (const task of state.cachedTasks) {
        if (task.status === 'archived' || task.status === 'done' || task.status === 'shipping') continue;
        if (task.time - now <= 0) {
            const updateData = { status: 'done', completed_at: now };
            await fetchSupabase('/tasks?id=eq.' + task.id, {
                method: 'PATCH',
                body: JSON.stringify(updateData)
            });
            hasChanges = true;
            state.notifiedTasks.delete(task.id);
        }
    }
    if (hasChanges) {
        await loadTasks(true);
    }
}

// 每秒执行
setInterval(async () => {
    if (state.cachedTasks.length > 0) {
        const now = Date.now();
        document.querySelectorAll('.task').forEach(el => {
            const id = parseInt(el.dataset.id);
            const task = state.cachedTasks.find(t => t.id === id);
            if (!task) return;
            const diff = task.time - now;
            const timerSpan = el.querySelector('.timer');
            if (timerSpan) {
                if (task.status === 'archived') {
                    timerSpan.textContent = '📦 已发货';
                    timerSpan.className = 'timer gray';
                } else if (task.status === 'done') {
                    timerSpan.textContent = formatCompletedTime(task.completed_at);
                    timerSpan.className = 'timer red';
                } else {
                    timerSpan.textContent = formatTimeLeft(diff);
                    timerSpan.className = `timer ${getTimerColor(diff)}`;
                }
            }
        });
    }
    await autoMoveExpiredTasks();
    checkAndNotify();
}, 1000);

// ============================================================
// 12. 拖拽排序（已归档不可拖出）
// ============================================================
function initSortable() {
    state.sortableInstances.forEach(inst => inst.destroy());
    state.sortableInstances = [];
    const cols = [dom.todo, dom.doing, dom.done, dom.shipping, dom.archived];
    cols.forEach(col => {
        const sortable = new Sortable(col, {
            group: 'tasks',
            animation: 150,
            ghostClass: 'sortable-ghost',
            dragClass: 'sortable-drag',
            onEnd: async function(evt) {
                const taskId = parseInt(evt.item.dataset.id);
                const fromId = evt.from.id;
                const targetId = evt.to.id;

                if (fromId === 'archived' && targetId !== 'archived') {
                    alert('已归档的任务不能移出，只能留在归档中。');
                    await loadTasks(false);
                    return;
                }

                let newStatus;
                if (targetId === 'todo') newStatus = 'todo';
                else if (targetId === 'doing') newStatus = 'doing';
                else if (targetId === 'done') newStatus = 'done';
                else if (targetId === 'shipping') newStatus = 'shipping';
                else if (targetId === 'archived') newStatus = 'archived';

                // 乐观更新
                const task = state.cachedTasks.find(t => t.id === taskId);
                if (task) {
                    task.status = newStatus;
                    if (newStatus === 'done') {
                        task.completed_at = Date.now();
                    } else {
                        task.completed_at = null;
                    }
                    renderTasks(state.cachedTasks);
                }

                // 异步保存
                try {
                    await updateTaskStatus(taskId, newStatus);
                } catch (err) {
                    console.error('拖拽保存失败:', err);
                    alert('保存状态失败，已回退。错误: ' + err.message);
                    await loadTasks(false);
                }
            }
        });
        state.sortableInstances.push(sortable);
    });
}

// ============================================================
// 13. 轮询（静默刷新）
// ============================================================
function startPolling() {
    setInterval(() => {
        if (!document.hidden) {
            loadTasks(true);
        }
    }, 3000);
}

// ============================================================
// 14. 初始化
// ============================================================
async function init() {
    requestNotificationPermission();
    await loadTasks(false);
    startPolling();
    const defaultTime = new Date(Date.now() + 7200000);
    const localDefault = new Date(defaultTime.getTime() - defaultTime.getTimezoneOffset() * 60000);
    dom.time.value = localDefault.toISOString().slice(0, 16);
    dom.modal.addEventListener('click', function(e) {
        if (e.target === dom.modal) closeModal();
    });
}
init().catch(console.error);

// 暴露全局函数
window.addTask = addTask;
window.deleteTask = deleteTask;
window.openEdit = openEdit;
window.saveEdit = saveEdit;
window.closeModal = closeModal;
window.uploadImg = uploadImg;
window.loadTasks = loadTasks;
window.openImageModal = openImageModal;
window.closeImageModal = closeImageModal;
</script>
