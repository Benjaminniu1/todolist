<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>任务单</title>

<style>
body{font-family:Arial;background:#eef2f7;margin:0;padding:20px;}
.container{max-width:1200px;margin:auto;background:#fff;padding:20px;border-radius:14px;}

.row{display:flex;gap:10px;margin-bottom:15px;}
input,button{padding:10px;border-radius:8px;border:1px solid #ddd;}

button{background:#3b82f6;color:#fff;border:none;cursor:pointer;}

.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}

.col{background:#f8fafc;padding:10px;border-radius:10px;min-height:300px;}

.task{background:#fff;border:1px solid #ddd;padding:10px;margin-bottom:8px;border-radius:10px;}

.task img{width:45px;height:45px;object-fit:cover;border-radius:6px;cursor:pointer;}

.timer{font-family:monospace;padding:4px 6px;border-radius:6px;display:inline-block;}

.red{background:#ffe4e6;color:#be123c;}
.yellow{background:#fef9c3;color:#854d0e;}
.blue{background:#dbeafe;color:#1d4ed8;}

.actions button{font-size:12px;margin-right:5px;}

/* modal */
.modal{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.6);
display:none;justify-content:center;align-items:center;
}

.modal-box{
background:#fff;padding:20px;border-radius:10px;width:320px;
}
</style>
</head>

<body>

<div class="container">

<h1>博远外贸跟单任务看板</h1>

<div class="row">
<input id="taskName" placeholder="任务名称">
<input id="taskTime" type="datetime-local">
<button onclick="App.add()">新增</button>
<input type="file" id="imgInput" accept="image/*" hidden>
</div>

<div class="board">
<div class="col" id="todo"><h3>待办</h3></div>
<div class="col" id="doing"><h3>进行中</h3></div>
<div class="col" id="done"><h3>已完成</h3></div>
</div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
<div class="modal-box">
<h3>编辑任务</h3>

<input id="editName">
<input id="editTime" type="datetime-local">

<button onclick="App.saveEdit()">保存</button>
<button onclick="UI.close()">取消</button>
</div>
</div>

<script>

/* ================= STORE ================= */
const Store = {
tasks:[],
editId:null,
imgId:null
};

/* ================= DB ================= */
const DB = {
save(){localStorage.setItem("v11_full",JSON.stringify(Store.tasks));},
load(){
let d=localStorage.getItem("v11_full");
Store.tasks=d?JSON.parse(d):[];
}
};

/* ================= NOTIFY ================= */
function notify(title,body){
if(Notification.permission==="granted"){
new Notification(title,{body});
}
}

if(Notification.permission!=="granted"){
Notification.requestPermission();
}

/* ================= APP ================= */
const App = {

/* ADD */
add(){
const n=document.getElementById("taskName").value.trim();
const t=document.getElementById("taskTime").value;

if(!n||!t)return alert("请填写完整");

Store.tasks.push({
id:Date.now(),
name:n,
time:new Date(t).getTime(),
status:"todo",
image:null,
warn:false,
done:false
});

DB.save();
UI.render();
},

/* EDIT */
openEdit(id){
Store.editId=id;
let t=Store.tasks.find(x=>x.id===id);

editName.value=t.name;

let dt=new Date(t.time);
dt.setMinutes(dt.getMinutes()-dt.getTimezoneOffset());

editTime.value=dt.toISOString().slice(0,16);

UI.open();
},

saveEdit(){
let t=Store.tasks.find(x=>x.id===Store.editId);

t.name=editName.value.trim();
t.time=new Date(editTime.value).getTime();

DB.save();
UI.render();
UI.close();
},

/* DELETE */
del(id){
Store.tasks=Store.tasks.filter(x=>x.id!==id);
DB.save();
UI.render();
},

/* IMAGE */
img(id){
Store.imgId=id;
imgInput.click();
}
};

/* ================= IMAGE ================= */
imgInput.onchange=e=>{
let f=e.target.files[0];
let r=new FileReader();

r.onload=ev=>{
let img=new Image();

img.onload=()=>{

let c=document.createElement("canvas");
let ctx=c.getContext("2d");

let w=img.width,h=img.height,m=300;

if(w>h){if(w>m){h*=m/w;w=m;}}
else{if(h>m){w*=m/h;h=m;}}

c.width=w;c.height=h;
ctx.drawImage(img,0,0,w,h);

let base=c.toDataURL("image/jpeg",0.7);

let t=Store.tasks.find(x=>x.id===Store.imgId);
t.image=base;

DB.save();
UI.render();
};

img.src=ev.target.result;
};

r.readAsDataURL(f);
};

/* ================= UI ================= */
const UI = {

render(){

todo.innerHTML="<h3>待办</h3>";
doing.innerHTML="<h3>进行中</h3>";
done.innerHTML="<h3>已完成</h3>";

let now=Date.now();

Store.tasks.forEach(t=>{

let diff=t.time-now;

if(diff<=0 && !t.done){
notify("任务到期",t.name);
t.done=true;
DB.save();
}

let div=document.createElement("div");
div.className="task";

div.innerHTML=`
${t.image?`<img src="${t.image}" onclick="App.img(${t.id})">`:''}
<div><b>${t.name}</b></div>

<div class="timer ${color(diff)}">${format(diff)}</div>

<div class="actions">
<button onclick="App.openEdit(${t.id})">修改</button>
<button onclick="App.del(${t.id})">删除</button>
<button onclick="App.img(${t.id})">图片</button>
</div>
`;

document.getElementById(t.status).appendChild(div);
});
},

open(){modal.style.display="flex";},
close(){modal.style.display="none";}
};

/* ================= TIME ================= */
function format(ms){
if(ms<=0)return"已结束";

let s=ms/1000;
let d=Math.floor(s/86400);s%=86400;
let h=Math.floor(s/3600);s%=3600;
let m=Math.floor(s/60);
let sec=Math.floor(s%60);

return (d?d+"天":"")+(h?h+"小时":"")+(m?m+"分":"")+sec+"秒";
}

function color(ms){
let d=ms/86400000;
if(d<1)return"red";
if(d<=2)return"yellow";
return"blue";
}

/* ================= LOOP ================= */
setInterval(()=>UI.render(),1000);

/* ================= INIT ================= */
DB.load();
UI.render();

</script>

</body>
</html>
