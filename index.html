<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务系统 V6.1（稳定修复版）</title>

<style>
body{
    font-family: Arial;
    background:#f4f6f8;
    margin:0;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:12px;
}

h1{text-align:center;}

.row{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

input,button{padding:8px;}

#taskName{flex:1;}

button{
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.add{background:#28a745;color:#fff;}

.stats{
    background:#eef2f7;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
}

/* 看板 */
.board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.col{
    background:#f8f9fa;
    border-radius:10px;
    padding:10px;
    min-height:300px;
}

.task{
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
    padding:10px;
    margin-bottom:8px;
    cursor:grab;
}

.name{
    font-weight:bold;
}

.timer{
    font-family:monospace;
    font-size:13px;
}

.btns{
    display:flex;
    gap:5px;
    margin-top:5px;
}

.start{background:#007bff;color:#fff;}
.edit{background:#ff9800;color:#fff;}
.del{background:#dc3545;color:#fff;}
</style>
</head>

<body>

<div class="container">

<h1>📊 任务系统 V6.1（稳定版）</h1>

<div class="stats">
今日专注：<span id="focus">0</span> 秒 |
任务数：<span id="total">0</span>
</div>

<div class="row">
    <input id="taskName" placeholder="任务名称">
    <input type="datetime-local" id="deadline">
    <button class="add" onclick="addTask()">新增任务</button>
</div>

<div class="board">
    <div class="col" id="todo" ondrop="drop(event,'todo')" ondragover="allow(event)">
        <h3>待办</h3>
    </div>

    <div class="col" id="doing" ondrop="drop(event,'doing')" ondragover="allow(event)">
        <h3>进行中</h3>
    </div>

    <div class="col" id="done" ondrop="drop(event,'done')" ondragover="allow(event)">
        <h3>已完成</h3>
    </div>
</div>

</div>

<script>

let tasks = JSON.parse(localStorage.getItem("tasks_v61") || "[]");
let focusTime = parseInt(localStorage.getItem("focus_v61") || "0");

/* 保存 */
function save(){
    localStorage.setItem("tasks_v61", JSON.stringify(tasks));
    localStorage.setItem("focus_v61", focusTime);
    document.getElementById("focus").innerText = focusTime;
    document.getElementById("total").innerText = tasks.length;
}

/* 新增 */
function addTask(){
    const name = document.getElementById("taskName").value.trim();
    const deadline = document.getElementById("deadline").value;

    if(!name) return alert("请输入任务");
    if(!deadline) return alert("请选择时间");

    tasks.push({
        id: Date.now(),
        name,
        endTime: new Date(deadline).getTime(),
        status: "todo",
        running: false
    });

    document.getElementById("taskName").value="";
    save();
    renderAll();
}

/* 删除 */
function del(id){
    tasks = tasks.filter(t=>t.id!==id);
    save();
    renderAll();
}

/* 开始/暂停 */
function toggle(id){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;
    t.running = !t.running;
    save();
    renderAll();
}

/* 修改 */
function edit(id){
    const t = tasks.find(x => x.id === id);
    if(!t) return;

    // 创建遮罩层（不改你原UI，只是临时弹窗）
    const mask = document.createElement("div");
    mask.style.position = "fixed";
    mask.style.top = "0";
    mask.style.left = "0";
    mask.style.right = "0";
    mask.style.bottom = "0";
    mask.style.background = "rgba(0,0,0,0.4)";
    mask.style.display = "flex";
    mask.style.alignItems = "center";
    mask.style.justifyContent = "center";
    mask.style.zIndex = "9999";

    // 当前时间格式化为 datetime-local
    const localTime = new Date(t.endTime);
    const formatted = localTime.toISOString().slice(0,16);

    mask.innerHTML = `
        <div style="
            background:#fff;
            padding:20px;
            border-radius:10px;
            width:300px;
        ">
            <h3>修改任务</h3>

            <input id="editName" style="width:100%;margin-bottom:10px;padding:6px;"
                value="${t.name}">

            <input id="editTime" type="datetime-local"
                style="width:100%;margin-bottom:10px;padding:6px;"
                value="${formatted}">

            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button id="cancelBtn">取消</button>
                <button id="saveBtn" style="background:#28a745;color:#fff;">保存</button>
            </div>
        </div>
    `;

    document.body.appendChild(mask);

    // 取消
    mask.querySelector("#cancelBtn").onclick = () => {
        document.body.removeChild(mask);
    };

    // 保存
    mask.querySelector("#saveBtn").onclick = () => {

        const newName = mask.querySelector("#editName").value.trim();
        const newTime = mask.querySelector("#editTime").value;

        if(!newName || !newTime){
            alert("不能为空");
            return;
        }

        t.name = newName;
        t.endTime = new Date(newTime).getTime();

        save();
        renderAll(); // ⚠️ 你V6.1版本用这个
        document.body.removeChild(mask);
    };
}

/* 状态 */
function setStatus(id,status){
    const t = tasks.find(x=>x.id===id);
    if(!t) return;

    t.status = status;
    if(status==="done") t.running=false;

    save();
    renderAll();
}

/* 拖拽 */
function allow(e){ e.preventDefault(); }

function drag(e){
    e.dataTransfer.setData("id", e.target.dataset.id);
}

function drop(e,status){
    const id = e.dataTransfer.getData("id");
    setStatus(Number(id), status);
}

/* 时间 */
function format(ms){
    if(ms<=0) return "已结束";

    let s=Math.floor(ms/1000);
    const d=Math.floor(s/86400); s%=86400;
    const h=Math.floor(s/3600); s%=3600;
    const m=Math.floor(s/60);
    const sec=s%60;

    return (d?d+"天":"")+(h?h+"小时":"")+(m?m+"分":"")+sec+"秒";
}

/* ====== ⭐关键优化：只渲染一次结构 ====== */
function renderAll(){

    ["todo","doing","done"].forEach(id=>{
        const col = document.getElementById(id);
        col.innerHTML = `<h3>${col.querySelector("h3").innerText}</h3>`;
    });

    tasks.forEach(t=>{
        const div = document.createElement("div");
        div.className="task";
        div.dataset.id=t.id;
        div.draggable=true;
        div.ondragstart=drag;

        div.innerHTML=`
            <div class="name">${t.name}</div>
            <div class="timer" id="timer-${t.id}">
                ${format(t.endTime-Date.now())}
                ${t.running?"（专注中）":""}
            </div>

            <div class="btns">
                <button class="start">${t.running?"暂停":"开始"}</button>
                <button class="edit">修改</button>
                <button class="del">删除</button>
            </div>
        `;

        div.querySelector(".start").onclick=()=>toggle(t.id);
        div.querySelector(".edit").onclick=()=>edit(t.id);
        div.querySelector(".del").onclick=()=>del(t.id);

        document.getElementById(t.status).appendChild(div);
    });

    save();
}

/* ====== ⭐只更新时间（不重绘DOM） ====== */
function updateTime(){

    tasks.forEach(t=>{
        const el = document.getElementById(`timer-${t.id}`);
        if(!el) return;

        const remain = t.endTime - Date.now();

        el.innerText =
            format(remain) + (t.running ? "（专注中）" : "");

        if(t.running && t.status !== "done"){
            focusTime++;
        }

        if(remain<=0){
            t.running=false;
            t.status="done";
        }
    });

    save();
}

setInterval(updateTime,1000);

renderAll();
save();

</script>

</body>
</html>
