<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>V12 云同步任务系统</title>

<style>
body{font-family:Arial;background:#eef2f7;margin:0;padding:20px;}
.container{max-width:1100px;margin:auto;background:#fff;padding:20px;border-radius:12px;}

.row{display:flex;gap:10px;margin-bottom:15px;}
input,button{padding:10px;border-radius:8px;border:1px solid #ddd;}

button{background:#3b82f6;color:#fff;border:none;cursor:pointer;}

.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}

.col{background:#f8fafc;padding:10px;border-radius:10px;min-height:300px;}

.task{background:#fff;border:1px solid #ddd;padding:10px;margin-bottom:8px;border-radius:10px;}

.timer{font-family:monospace;padding:4px 6px;border-radius:6px;display:inline-block;}

.red{background:#ffe4e6;}
.yellow{background:#fef9c3;}
.blue{background:#dbeafe;}

.actions button{font-size:12px;margin-right:5px;}
</style>
</head>

<body>

<div class="container">

<h1>🚀 V12 云同步版（Supabase）</h1>

<div class="row">
<input id="name" placeholder="任务名称">
<input id="time" type="datetime-local">
<button onclick="App.add()">新增</button>
</div>

<div class="board">
<div class="col" id="todo"><h3>待办</h3></div>
<div class="col" id="doing"><h3>进行中</h3></div>
<div class="col" id="done"><h3>已完成</h3></div>
</div>

</div>

<!-- modal -->
<div id="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);justify-content:center;align-items:center;">
<div style="background:#fff;padding:20px;width:300px;border-radius:10px;">
<h3>编辑任务</h3>
<input id="editName"><br><br>
<input id="editTime" type="datetime-local"><br><br>
<button onclick="App.saveEdit()">保存</button>
<button onclick="UI.close()">取消</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

/* ================= SUPABASE ================= */
const supabase = window.supabase.createClient(
"SUPABASE_URL",
"SUPABASE_KEY"
);

/* ================= STATE ================= */
const Store = {
tasks:[],
editId:null
};

/* ================= LOAD ================= */
async function load(){
let {data} = await supabase.from("tasks").select("*");
Store.tasks = data || [];
UI.render();
}

/* ================= APP ================= */
const App = {

async add(){

const n = document.getElementById("name").value.trim();
const t = document.getElementById("time").value;

if(!n||!t)return alert("请填写完整");

let task = {
id:Date.now(),
name:n,
time:new Date(t).getTime(),
status:"todo",
image:null,
warn:false,
done:false
};

await supabase.from("tasks").insert([task]);

await load();
},

openEdit(id){
Store.editId=id;
let t=Store.tasks.find(x=>x.id===id);

editName.value=t.name;
let dt=new Date(t.time);
dt.setMinutes(dt.getMinutes()-dt.getTimezoneOffset());
editTime.value=dt.toISOString().slice(0,16);

modal.style.display="flex";
},

async saveEdit(){

let t=Store.tasks.find(x=>x.id===Store.editId);

await supabase.from("tasks")
.update({
name:editName.value,
time:new Date(editTime.value).getTime()
})
.eq("id",Store.editId);

modal.style.display="none";
await load();
},

async del(id){
await supabase.from("tasks").delete().eq("id",id);
await load();
}
};

/* ================= UI ================= */
const UI = {

render(){

todo.innerHTML="<h3>待办</h3>";
doing.innerHTML="<h3>进行中</h3>";
done.innerHTML="<h3>已完成</h3>";

let now=Date.now();

Store.tasks.forEach(t=>{

let diff=t.time-now;

let div=document.createElement("div");
div.className="task";

div.innerHTML=`
<div><b>${t.name}</b></div>
<div class="timer">${format(diff)}</div>

<div class="actions">
<button onclick="App.openEdit(${t.id})">修改</button>
<button onclick="App.del(${t.id})">删除</button>
</div>
`;

document.getElementById(t.status).appendChild(div);
});
},

close(){
modal.style.display="none";
}
};

/* ================= TIME ================= */
function format(ms){
if(ms<=0)return"已结束";

let s=ms/1000;
let d=Math.floor(s/86400);s%=86400;
let h=Math.floor(s/3600);s%=3600;
let m=Math.floor(s/60);
let sec=Math.floor(s%60);

return (d?d+"天":"")+(h?h+"小时":"")+(m?m+"分":"")+sec+"秒";
}

/* ================= LOOP ================= */
setInterval(()=>UI.render(),1000);

/* ================= INIT ================= */
load();

</script>

</body>
</html>
