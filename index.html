<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>任务单</title>

<style>
body{
    font-family:Arial;
    background:#eef2f7;
    margin:0;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

h1{text-align:center;}

.row{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

input,button{
    padding:10px;
    border-radius:8px;
    border:1px solid #ddd;
}

button{
    background:#3b82f6;
    color:#fff;
    border:none;
    cursor:pointer;
}

.board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.col{
    background:#f8fafc;
    padding:10px;
    border-radius:12px;
    min-height:300px;
}

.task{
    background:#fff;
    border:1px solid #ddd;
    padding:10px;
    margin-bottom:8px;
    border-radius:10px;
}

.task img{
    width:45px;
    height:45px;
    object-fit:cover;
    border-radius:6px;
    cursor:pointer;
}

.timer{
    font-family:monospace;
    padding:4px 6px;
    border-radius:6px;
    display:inline-block;
}

.red{background:#ffe4e6;color:#be123c;}
.yellow{background:#fef9c3;color:#854d0e;}
.blue{background:#dbeafe;color:#1d4ed8;}

.actions{
    margin-top:8px;
    display:flex;
    gap:6px;
}

.actions button{
    font-size:12px;
    padding:5px 8px;
}

/* modal */
.modal{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-box{
    width:320px;
    background:#fff;
    padding:20px;
    border-radius:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>博远外贸跟单任务看板</h1>

<div class="row">
<input id="name" placeholder="任务名称">
<input id="time" type="datetime-local">
<button onclick="addTask()">新增</button>
<input type="file" id="file" accept="image/*" hidden>
</div>

<div class="board">
<div class="col" id="todo"><h3>待办</h3></div>
<div class="col" id="doing"><h3>进行中</h3></div>
<div class="col" id="done"><h3>已完成</h3></div>
</div>

</div>

<!-- 编辑弹窗 -->
<div id="modal" class="modal">
<div class="modal-box">

<h3>编辑任务</h3>

<input id="editName">
<input id="editTime" type="datetime-local">

<button onclick="saveEdit()">保存</button>
<button onclick="closeModal()" style="background:#ef4444;">取消</button>

</div>
</div>

<script>

/* ================= DATA ================= */
let tasks = [];
let editId = null;
let imgId = null;

/* ================= NOTIFY ================= */
function initNotify(){
if(Notification.permission !== "granted"){
Notification.requestPermission();
}
}

function notify(title, body){
if(Notification.permission === "granted"){
new Notification(title,{
body:body
});
}else{
alert(body);
}
}

/* ================= STORAGE ================= */
function saveData(){
localStorage.setItem("tasks_v10_notify", JSON.stringify(tasks));
}

function loadData(){
let d = localStorage.getItem("tasks_v10_notify");
if(d) tasks = JSON.parse(d);
}

/* ================= ADD ================= */
function addTask(){

const n = name.value;
const t = time.value;

if(!n || !t) return alert("请填写完整");

tasks.push({
id:Date.now(),
name:n,
time:new Date(t).getTime(),
status:"todo",
image:null,
warn:false,
doneWarn:false
});

saveData();
render();
}

/* ================= EDIT ================= */
function openEdit(id){
editId = id;

let t = tasks.find(x=>x.id===id);

editName.value = t.name;

let dt = new Date(t.time);
dt.setMinutes(dt.getMinutes()-dt.getTimezoneOffset());

editTime.value = dt.toISOString().slice(0,16);

modal.style.display="flex";
}

function saveEdit(){
let t = tasks.find(x=>x.id===editId);

t.name = editName.value;
t.time = new Date(editTime.value).getTime();

saveData();
render();
closeModal();
}

function closeModal(){
modal.style.display="none";
editId=null;
}

/* ================= DELETE ================= */
function del(id){
tasks = tasks.filter(t=>t.id!==id);
saveData();
render();
}

/* ================= IMAGE ================= */
file.onchange = e=>{
let f = e.target.files[0];

let r = new FileReader();

r.onload = ev=>{
let img = new Image();

img.onload = ()=>{

let c=document.createElement("canvas");
let ctx=c.getContext("2d");

let w=img.width,h=img.height,m=300;

if(w>h){if(w>m){h*=m/w;w=m;}}
else{if(h>m){w*=m/h;h=m;}}

c.width=w;c.height=h;
ctx.drawImage(img,0,0,w,h);

let base = c.toDataURL("image/jpeg",0.7);

let t = tasks.find(x=>x.id===imgId);
t.image = base;

saveData();
render();
};

img.src = ev.target.result;
};

r.readAsDataURL(f);
};

function uploadImg(id){
imgId = id;
file.click();
}

/* ================= TIME ================= */
function format(ms){
if(ms<=0)return "已结束";

let s=ms/1000;
let d=Math.floor(s/86400);s%=86400;
let h=Math.floor(s/3600);s%=3600;
let m=Math.floor(s/60);
let sec=Math.floor(s%60);

return (d?d+"天":"")+(h?h+"小时":"")+(m?m+"分":"")+sec+"秒";
}

function color(ms){
let d=ms/86400000;
if(d<1)return"red";
if(d<=2)return"yellow";
return"blue";
}

/* ================= REMINDER ================= */
function check(){

let now = Date.now();

tasks.forEach(t=>{

let diff = t.time - now;

if(diff<=0 && !t.doneWarn){
notify("任务到期", t.name);
t.doneWarn = true;
}

if(diff<=86400000 && !t.warn){
notify("24小时提醒", t.name);
t.warn = true;
}

});

saveData();
}

/* ================= RENDER ================= */
function render(){

todo.innerHTML="<h3>待办</h3>";
doing.innerHTML="<h3>进行中</h3>";
done.innerHTML="<h3>已完成</h3>";

let now = Date.now();

tasks.forEach(t=>{

let diff = t.time - now;

let div = document.createElement("div");
div.className="task";

div.innerHTML=`
${t.image?`<img src="${t.image}" onclick="uploadImg(${t.id})">`:''}
<div><b>${t.name}</b></div>
<div class="timer ${color(diff)}">${format(diff)}</div>

<div class="actions">
<button onclick="uploadImg(${t.id})">图片</button>
<button onclick="openEdit(${t.id})">修改</button>
<button onclick="del(${t.id})">删除</button>
</div>
`;

document.getElementById(t.status).appendChild(div);
});
}

/* ================= LOOP ================= */
setInterval(()=>{
render();
check();
},1000);

/* ================= INIT ================= */
loadData();
initNotify();
render();

</script>

</body>
</html>
